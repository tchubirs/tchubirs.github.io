<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Replay — vários ângulos, um relógio</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
  <h1>Replay</h1>
  <p class="sub">Cola os canais que estiveram na mesma noite. Um relógio para todos.</p>
</header>

<section id="entrada">
  <label for="procurar">Procurar um canal</label>
  <div class="procura">
    <input id="procurar" type="search" autocomplete="off" spellcheck="false"
      placeholder="escreve o início do nome…">
    <ul id="sugestoes" class="sugestoes" hidden></ul>
  </div>

  <label for="canais">Canais da Kick, um por linha</label>
  <textarea id="canais" rows="6" spellcheck="false"
    placeholder="tchubi&#10;outrocanal&#10;maisum"></textarea>
  <div class="linha">
    <button id="carregar" class="principal">Carregar a noite</button>
    <span id="estadoCarga" class="nota"></span>
  </div>
  <!-- Próprio sítio, e não a linha de progresso: o aviso do leitor tem de
       sobreviver ao texto que muda a cada canal carregado. -->
  <p id="avisoPlayer" class="nota mau" hidden></p>
</section>

<section id="noites" hidden>
  <label for="noite">Qual noite</label>
  <select id="noite"></select>
  <span class="nota" id="resumoNoite"></span>
</section>

<section id="canaisEstado" hidden>
  <h2>Canais</h2>
  <ul id="listaCanais" class="canais"></ul>
</section>

<section id="palco" hidden>
  <!-- Os ângulos em foco vivem aqui, e a grelha fica em baixo. Dois containers
       em vez de um truque de CSS: com dois em foco lado a lado, "esticar a
       célula até ao fim da linha" deixa de existir como conceito. -->
  <div id="palcoFoco" class="palcoFoco"></div>
  <div id="grade" class="grade"></div>

  <div class="relogio">
    <input id="barra" type="range" min="0" max="1000" value="0" step="1" aria-label="linha do tempo">
    <div class="linha">
      <output id="agora" class="tempo">—</output>
      <output id="angulos" class="nota">—</output>
    </div>
    <!-- Os quatro na mesma linha, sempre: em grelha de quatro colunas iguais,
         que não parte num ecrã estreito como uma linha flex parte. -->
    <div class="saltos">
      <button id="menos1m" title="voltar 1 minuto">&laquo; 1 min</button>
      <button id="menos10s" title="voltar 10 segundos">&lsaquo; 10s</button>
      <button id="mais10s" title="avançar 10 segundos">10s &rsaquo;</button>
      <button id="mais1m" title="avançar 1 minuto">1 min &raquo;</button>
    </div>
    <div class="linha">
      <button id="marcarIn">Marca início <kbd>I</kbd></button>
      <button id="marcarOut">Marca fim <kbd>O</kbd></button>
      <output id="marca" class="nota"></output>
    </div>
  </div>

  <div class="linha">
    <button id="alinhar" title="ouve um bocado de cada ângulo e corrige o desvio de cada um">Alinhar pelo som</button>
    <span id="estadoAlinhar" class="nota"></span>
  </div>

  <section id="corte" hidden>
    <h2>Cortar</h2>
    <ul id="listaCorte" class="corte"></ul>
  </section>

  <ul id="fila" class="fila"></ul>
</section>

<footer>
  <!-- A versao, a serio e visivel. O GitHub Pages serve com max-age=600 e um
       telemovel guarda o app.js antigo; sem isto, "ja corrigi" e "continua
       igual" sao as duas verdadeiras ao mesmo tempo e ninguem sai dali. -->
  <p class="nota">Tudo acontece no teu navegador. Os VODs são de quem os gravou. · <span id="versao">399d21bfed</span></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script type="module" src="app.js?v=399d21bfed"></script>
</body>
</html>
