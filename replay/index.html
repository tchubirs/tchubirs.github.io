<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-t="app.titulo">Replay — vários ângulos, um relógio</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header>
  <div class="topo">
    <h1 data-t="app.nome">Replay</h1>
    <a class="paraTwitch" href="twitch.html" data-t="app.twitch">Twitch</a>
    <select id="idioma" aria-label="idioma"></select>
  </div>
  <p class="sub" data-t="app.sub">Cola os canais que estiveram na mesma noite. Um relógio para todos.</p>
</header>

<section id="entrada">
  <label for="procurar" data-t="procurar.label">Procurar um canal</label>
  <div class="procura">
    <input id="procurar" type="search" autocomplete="off" spellcheck="false"
      data-t-ph="procurar.ph" placeholder="escreve o início do nome…">
    <ul id="sugestoes" class="sugestoes" hidden></ul>
  </div>

  <label for="canais" data-t="canais.label">Canais da Kick, um por linha</label>
  <textarea id="canais" rows="6" spellcheck="false"
    placeholder="tchubi&#10;outrocanal&#10;maisum"></textarea>
  <div class="linha">
    <button id="carregar" class="principal" data-t="canais.carregar">Carregar a noite</button>
    <span id="estadoCarga" class="nota"></span>
  </div>
  <!-- Próprio sítio, e não a linha de progresso: o aviso do leitor tem de
       sobreviver ao texto que muda a cada canal carregado. -->
  <p id="avisoPlayer" class="nota mau" hidden></p>
</section>

<section id="noites" hidden>
  <label for="noite" data-t="noite.label">Qual noite</label>
  <select id="noite"></select>
  <span class="nota" id="resumoNoite"></span>
</section>

<section id="canaisEstado" hidden>
  <h2 data-t="canais.titulo">Canais</h2>
  <ul id="listaCanais" class="canais"></ul>
</section>

<section id="palco" hidden>
  <!-- Os ângulos em foco vivem aqui, e a grelha fica em baixo. Dois containers
       em vez de um truque de CSS: com dois em foco lado a lado, "esticar a
       célula até ao fim da linha" deixa de existir como conceito. -->
  <div id="palcoFoco" class="palcoFoco"></div>
  <div id="grade" class="grade"></div>

  <div class="relogio">
    <!-- A barra vive na MESMA grelha das faixas, com a mesma coluna vazia à
         esquerda. Sem isso, a barra media a largura toda e as faixas mediam a
         largura menos os nomes: o cursor e o puxador ficavam em sítios
         diferentes para o mesmo instante. -->
    <div class="barraLinha">
      <span></span>
      <input id="barra" type="range" min="0" max="1000" value="0" step="1" data-t-aria="tempo.linha" aria-label="linha do tempo">
    </div>
    <!-- Quem esteve no ar, e quando. Sem isto procura-se o momento a arrastar a
         barra as cegas: os buracos e as sobreposicoes so se descobriam batendo
         com o nariz neles. -->
    <div id="faixas" class="faixas"><div id="cursor" class="cursor"></div></div>
    <!-- A regua, como num editor: as horas por baixo das barras, e as kills
         marcadas nela. Sem isto sabe-se que se esta "algures no meio". -->
    <div class="reguaLinha"><span></span><div id="regua" class="regua"></div></div>
    <div class="linha">
      <output id="agora" class="tempo">—</output>
      <output id="angulos" class="nota">—</output>
    </div>
    <!-- Os quatro na mesma linha, sempre: em grelha de quatro colunas iguais,
         que não parte num ecrã estreito como uma linha flex parte. -->
    <div class="saltos">
      <button id="menos1m" data-t="tempo.menos1m" data-t-titulo="tempo.voltar1m" title="voltar 1 minuto">&laquo; 1 min</button>
      <button id="menos10s" data-t="tempo.menos10s" data-t-titulo="tempo.voltar10s" title="voltar 10 segundos">&lsaquo; 10s</button>
      <button id="mais10s" data-t="tempo.mais10s" data-t-titulo="tempo.avancar10s" title="avançar 10 segundos">10s &rsaquo;</button>
      <button id="mais1m" data-t="tempo.mais1m" data-t-titulo="tempo.avancar1m" title="avançar 1 minuto">1 min &raquo;</button>
    </div>
    <div class="linha">
      <button id="clipar" class="principal"><span data-t="clipe.botao">Clipar</span> <kbd>C</kbd></button>
      <button id="marcarIn"><span data-t="marca.inicio">Marca início</span> <kbd>I</kbd></button>
      <button id="marcarOut"><span data-t="marca.fim">Marca fim</span> <kbd>O</kbd></button>
      <output id="marca" class="nota"></output>
    </div>
  </div>

  <div class="linha">
    <button id="alinhar" data-t="alinhar.botao" data-t-titulo="alinhar.ajuda" title="ouve um bocado de cada ângulo e corrige o desvio de cada um">Alinhar pelo som</button>
    <span id="estadoAlinhar" class="nota"></span>
  </div>

  <!-- A montagem. O fluxo do dono: marca-se a kill, e a pagina entrega a POV
       dele longa e as POVs de quem morreu curtinhas, ja numeradas. -->
  <section id="montagem">
    <h2 data-t="montagem.titulo">Montagem</h2>
    <div class="linha">
      <button id="marcarKill" class="principal"><span data-t="montagem.marcar">Marcar kill</span> <kbd>M</kbd></button>
      <button id="procurarKills" data-t="auto.botao">Procurar kills sozinho</button>
      <select id="janelaAuto" aria-label="quanto procurar">
        <option value="1800" data-t="auto.meiaHora">meia hora</option>
        <option value="3600" selected data-t="auto.umaHora">uma hora</option>
        <option value="0" data-t="auto.noiteToda">a noite toda</option>
      </select>
      <label class="pequeno"><span data-t="montagem.minhaPov">minha POV</span> <input id="protAntes" type="number" value="5" min="0" max="120" step="1">s antes</label>
      <label class="pequeno"><input id="protDepois" type="number" value="2" min="0" max="120" step="1">s depois</label>
      <label class="pequeno"><span data-t="montagem.quemMorreu">quem morreu</span> <input id="vitAntes" type="number" value="1" min="0" max="60" step="1">s antes</label>
      <label class="pequeno"><input id="vitDepois" type="number" value="2" min="0" max="60" step="1">s depois</label>
    </div>
    <!-- A barra de selecao. Uma noite varrida da dezenas de candidatos e a
         maioria nao e kill; apagar um a um era o trabalho manual que a busca
         automatica existe para tirar. -->
    <div class="linha barraSelecao">
      <label class="pequeno"><span data-t="sel.mostrar">mostrar</span>
        <select id="filtroMomentos" data-t-aria="sel.mostrar">
          <option value="todos" data-t="sel.todos">todos</option>
          <option value="comMorte" data-t="sel.comMorte">só com morte confirmada</option>
          <option value="semMorte" data-t="sel.semMorte">só os que faltam decidir</option>
        </select>
      </label>
      <button id="selecionarTudo" data-t="sel.tudo">selecionar tudo</button>
      <button id="selecionarNada" data-t="sel.nada">limpar seleção</button>
      <button id="apagarSelecionados" data-t="sel.apagar" disabled>apagar selecionados</button>
      <button id="anularApagar" data-t="sel.anular" hidden>anular</button>
      <span id="estadoSelecao" class="nota"></span>
    </div>
    <ul id="listaMomentos" class="momentos"></ul>
    <div class="linha">
      <button id="baixarMontagem" data-t="montagem.baixar" disabled>Baixar a montagem</button>
      <span id="estadoMontagem" class="nota"></span>
    </div>
  </section>

  <section id="corte">
    <h2 data-t="corte.titulo">Cortar</h2>
    <ul id="listaCorte" class="corte"></ul>
    <p id="comoCortar" class="nota"></p>
  </section>

  <div class="linha">
    <button id="limparFila" data-t="fila.limpar">Limpar a lista</button>
    <button id="recomecar" data-t="fila.recomecar">Recomeçar do zero</button>
    <span id="memoria" class="nota"></span>
  </div>
  <!-- Trinta e seis ficheiros num so. Aparece sozinho quando ha mais do que
       um clipe pronto — com um clipe so, o ZIP e um passo a mais. -->
  <div id="zip" class="linha"></div>
  <ul id="fila" class="fila"></ul>
</section>

<!-- Criar clipe: uma janela por cima, com a barra de corte e um limite de
     180 s. E o caminho para "quero um so, agora" — a montagem e para depois. -->
<div id="modalClipe" class="modal" hidden>
  <div class="modalCaixa" role="dialog" aria-modal="true" data-t-aria="clipe.titulo" aria-label="Criar clipe">
    <div class="modalTopo">
      <b data-t="clipe.titulo">Criar clipe</b>
      <select id="canalClipe" data-t-aria="clipe.angulo" aria-label="ângulo"></select>
      <button id="fecharClipe" data-t-titulo="clipe.fechar" title="fechar">✕</button>
    </div>
    <video id="previaClipe" playsinline muted></video>
    <div id="barraClipe" class="barraClipe">
      <div class="seleccao"></div>
      <button class="pega de" data-t-aria="clipe.inicio" aria-label="início do clipe"></button>
      <button class="pega ate" data-t-aria="clipe.fim" aria-label="fim do clipe"></button>
      <div class="cabeca"></div>
    </div>
    <div class="linha">
      <output id="tempoClipe" class="nota"></output>
      <button id="menosClipe">−1s</button>
      <button id="maisClipe">+1s</button>
    </div>
    <label for="tituloClipe" data-t="clipe.tituloLabel">Título do clipe</label>
    <input id="tituloClipe" type="text" maxlength="80" data-t-ph="clipe.tituloPh" placeholder="opcional — entra no nome do ficheiro">
    <div class="linha fim">
      <span id="estadoClipe" class="nota"></span>
      <button id="cancelarClipe" data-t="clipe.cancelar">Cancelar</button>
      <button id="guardarClipe" class="principal" data-t="clipe.guardar">Guardar clipe</button>
    </div>
  </div>
</div>

<footer>
  <!-- A versao, a serio e visivel. O GitHub Pages serve com max-age=600 e um
       telemovel guarda o app.js antigo; sem isto, "ja corrigi" e "continua
       igual" sao as duas verdadeiras ao mesmo tempo e ninguem sai dali. -->
  <p class="nota"><span data-t="app.rodape">Tudo acontece no teu navegador. Os VODs são de quem os gravou.</span> · <span id="versao">3c911f5814</span></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<script type="module" src="app.js?v=3c911f5814"></script>
</body>
</html>
