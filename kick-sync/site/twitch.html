<title data-t="tw.titulo">Povix Twitch — os POVs lado a lado</title>

<link rel="preload" as="font" type="font/woff2" href="letra/ibm-plex-sans-400.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="letra/ibm-plex-sans-600.woff2" crossorigin>
<link rel="preload" as="font" type="font/woff2" href="letra/ibm-plex-mono-400.woff2" crossorigin>

<link rel="stylesheet" href="estilo.css">

<!-- Os três símbolos que esta página usa. O conjunto inteiro vive no
     index.html; aqui só entra o que se vê, para a página não carregar
     trinta desenhos por causa de dois. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
  <symbol id="i-povix" viewBox="0 0 24 24">
    <g fill="currentColor">
      <path d="M2.25 4.5 L7.54 12.23 L10.91 8.03 Z"/>
      <path d="M21.75 3.38 L12.79 7.99 L16.46 11.93 Z" opacity=".85"/>
      <path d="M16.5 22.88 L15.9 14.59 L10.91 16.73 Z" opacity=".7"/>
    </g>
    <circle cx="12" cy="12.38" r="2.9" fill="#E4A13A"/>
    <circle cx="12" cy="12.38" r="1" fill="#131211"/>
  </symbol>
  <symbol id="i-twitch" viewBox="0 0 24 24">
    <path fill="currentColor" d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/>
  </symbol>
  <symbol id="i-tocar" viewBox="0 0 24 24">
    <path d="M8.8 6.1 19 12 8.8 17.9Z" fill="currentColor" stroke="currentColor"
      stroke-width="2.4" stroke-linejoin="round"/>
  </symbol>
</svg>

<header>
  <div class="topo">
    <h1><svg class="ic" aria-hidden="true"><use href="#i-povix"/></svg><a href="./" class="voltar">Povix</a>
      <span class="marca"><svg class="ic ic-p" aria-hidden="true"><use href="#i-twitch"/></svg>Twitch</span></h1>
    <select id="idioma" aria-label="idioma"></select>
  </div>
</header>

<!-- O que esta versao nao faz, dito a entrada e nao descoberto ao fim de meia
     hora. A medicao esta em probes/twitch.mjs. -->
<p class="aviso" data-t-html="tw.limite"></p>

<section>
  <h2 data-t="tw.canais">Canais</h2>
  <div class="linha">
    <input id="procurar" data-t-ph="tw.procurarPh" placeholder="procurar um canal pelo nome">
    <button id="botaoProcurar" data-t="tw.procurar">Procurar</button>
  </div>
  <div id="sugestoes" class="sugestoes"></div>
  <textarea id="canais" rows="4" data-t-ph="tw.canaisPh"
    placeholder="um canal por linha"></textarea>
  <div class="linha">
    <button id="carregar" class="principal" data-t="tw.carregar">Carregar</button>
    <span id="estado" class="nota"></span>
  </div>
</section>

<section id="painelNoite" hidden>
  <h2 data-t="tw.noite">Noite</h2>
  <div class="linha">
    <select id="noites" aria-label="noite"></select>
    <span id="quemNaNoite" class="nota"></span>
  </div>
</section>

<section id="palco" hidden>
  <div class="linha barraTempo">
    <button id="tocar" class="principal"><svg class="ic ic-p" aria-hidden="true"><use href="#i-tocar"/></svg><span data-t="tw.tocar">Reproduzir</span></button>
    <button id="menos1m" data-t-aria="tempo.voltar1m">−<span data-t="tempo.menos1m">1 min</span></button>
    <button id="menos10s" data-t-aria="tempo.voltar10s">−<span data-t="tempo.menos10s">10s</span></button>
    <button id="mais10s" data-t-aria="tempo.avancar10s">+<span data-t="tempo.mais10s">10s</span></button>
    <button id="mais1m" data-t-aria="tempo.avancar1m">+<span data-t="tempo.mais1m">1 min</span></button>
    <span id="relogio" class="tempo"></span>
    <span id="noAr" class="nota"></span>
  </div>
  <input id="barra" type="range" min="0" max="1000" value="0" step="1" aria-label="linha do tempo">
  <div id="grade" class="grade gradeTw"></div>
</section>

<footer class="nota">
  <span data-t="tw.rodape">Sincronizado pela hora de transmissão de cada VOD. Dois segundos de erro, medidos.</span> · <span id="versao">dev</span>
</footer>
