name: fedimod

on:
  push:
    paths: ["fedimod/**", ".github/workflows/fedimod.yml"]
  pull_request:
    paths: ["fedimod/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: fedimod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Run tests
        run: npm test
