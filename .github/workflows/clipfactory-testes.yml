# Os testes do clipfactory, a cada push.
#
# O ficheiro `clipfactory.yml` ao lado deste é o trabalho de PRODUÇÃO: corre por
# horário, produz clipes e publica. Nunca correu um teste. Durante meses a suite
# do clipfactory não correu em CI nenhuma — só na máquina de quem a escreveu.
#
# Isto descobriu-se do pior jeito possível: um push mexeu no `ingest`, no
# `config` e no `cli` e o GitHub reportou ZERO verificações. Verde por ausência
# não é verde.
name: clipfactory · testes

on:
  push:
    paths: ['clipfactory/**', '.github/workflows/clipfactory-testes.yml']
  pull_request:
    paths: ['clipfactory/**', '.github/workflows/clipfactory-testes.yml']
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clipfactory
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
          pip install pytest

      - name: Correr os testes
        run: pytest tests -q

      # O `doctor` sai 0 mesmo com coisas em falta — o que ele dá é o relatório.
      # Aqui só se exige que ele CORRA: se um import se partiu, é neste passo
      # que se vê, e não às 09h10 da manhã com a publicação a meio.
      - name: Pré-voo
        run: clipfactory doctor
