# Os testes do Replay, a cada push.
#
# Sem isto, os testes só corriam quando alguém se lembrava — e a única maneira
# de saber que o site tinha partido era o dono abri-lo e ver.
#
# Os testes de browser correm de verdade: um Chromium a sério, contra uma Kick
# falsa servida em memória. Sem isso metade da suite não corre e o verde
# passa a ser uma opinião.
name: replay

on:
  push:
    paths: ['kick-sync/**', '.github/workflows/replay.yml']
  pull_request:
    paths: ['kick-sync/**', '.github/workflows/replay.yml']
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kick-sync
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar FFmpeg para validar os MP4 exportados
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version

      # O Playwright traz o seu próprio Chromium. `--with-deps` porque um
      # runner limpo não tem as bibliotecas de sistema que ele precisa, e sem
      # elas o browser arranca e morre sem dizer porquê.
      - name: Instalar o Playwright
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      # O caminho do Chromium muda a cada versão do Playwright; perguntar em
      # vez de escrever um número que envelhece em silêncio. Vai para o
      # GITHUB_ENV e não para um `export`: um `export` morre com o step, e foi
      # exactamente assim que o passo de verificação se enganou a si próprio.
      - name: Encontrar o Chromium
        run: |
          caminho="$(node -e "
            const { chromium } = require('playwright');
            process.stdout.write(chromium.executablePath());
          ")"
          test -x "$caminho" || { echo "::error::o Chromium não está em $caminho"; exit 1; }
          echo "chromium: $caminho"
          echo "DETETIVE_CHROME=$caminho" >> "$GITHUB_ENV"

      # Uma corrida só. A verificação lê a saída dessa corrida — correr a suite
      # duas vezes custava o dobro e testava a mesma coisa.
      #
      # Um teste de browser que não corre é um teste que não existe. Se o
      # Chromium faltar, a suite fica verde a testar metade — e é assim que um
      # bug de interface chega ao ar com 176 verdes por trás.
      - name: Correr os testes
        run: |
          set -o pipefail
          # 180 s por ficheiro, e a razao esta medida.
          #
          # Os testes de pagina levavam 148 s num ficheiro so e a CI cortava aos
          # 120: a suite ficava vermelha sem nada estar partido. Estao em dois
          # (pagina e pagina2, com o palco partilhado em palco.mjs), medidos em
          # 62 s e 89 s, e correm ao mesmo tempo. O limite continua a existir
          # para apanhar um teste PENDURADO — que e para isso que serve — mas
          # com folga suficiente para uma maquina mais lenta do que esta.
          node --test --test-timeout=180000 test/*.mjs 2>&1 | tee /tmp/saida.txt
        shell: bash

      - name: Garantir que os testes de browser correram mesmo
        if: always()
        run: |
          if grep -q 'sem navegador' /tmp/saida.txt; then
            grep -c 'sem navegador' /tmp/saida.txt
            echo "::error::os testes de browser foram saltados — o Chromium não foi encontrado"
            exit 1
          fi
          echo "nenhum teste saltado por falta de browser"

  contexto_cloudflare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kick-sync/cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Preparar contrato compartilhado
        run: mkdir -p public && cp ../site/contexto-rust.js public/contexto-rust.js
      - name: Conferir adaptador e limites sem chamadas pagas
        run: node --test test/*.test.mjs

  # Diagnóstico isolado do teste de contexto simples de página, num Google
  # Chrome oficial (não o Chromium do Playwright). Não substitui o job
  # `testes`, que continua a correr a suíte toda em Chromium.
  # Anthropic é mockada pelo próprio teste; nenhuma chave real é usada.
  contexto_chrome:
    name: contexto_chrome_${{ matrix.suite }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [contexto, completa]
    defaults:
      run:
        working-directory: kick-sync
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar o Playwright e o Google Chrome
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chrome

      - name: Instalar FFmpeg para validar os MP4 exportados
        if: matrix.suite == 'completa'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg
          ffmpeg -version

      - name: Encontrar o Google Chrome
        run: |
          caminho="$(command -v google-chrome)" || { echo "::error::google-chrome não está no PATH"; exit 1; }
          test -x "$caminho" || { echo "::error::google-chrome não é executável: $caminho"; exit 1; }
          echo "google-chrome: $caminho"
          echo "DETETIVE_CHROME=$caminho" >> "$GITHUB_ENV"

      # Metadados reais do browser que o teste vai usar, antes de qualquer teste.
      # Só lê capacidades do browser; não faz chamadas de rede a APIs pagas.
      - name: Imprimir metadados do Chrome
        run: |
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({
              executablePath: process.env.DETETIVE_CHROME,
              headless: true,
            });
            try {
              const page = await browser.newPage();
              const info = await page.evaluate(() => {
                const sup = (t) => (typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported(t));
                const rec = (t) => (typeof MediaRecorder !== 'undefined' && MediaRecorder.isTypeSupported(t));
                return {
                  userAgent: navigator.userAgent,
                  mediaRecorderExiste: typeof MediaRecorder !== 'undefined',
                  webmVP8: rec('video/webm;codecs=vp8'),
                  webmVP9: rec('video/webm;codecs=vp9'),
                  mediaSourceH264AAC: sup('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'),
                  mediaSourceWebmVP8: sup('video/webm; codecs="vp8"'),
                };
              });
              console.log('versão do browser:', browser.version());
              console.log('executável:', process.env.DETETIVE_CHROME);
              console.log(JSON.stringify(info, null, 2));
            } finally {
              await browser.close();
            }
          })().catch((e) => { console.error(e); process.exit(1); });
          EOF

      - name: Correr os testes no Chrome
        run: |
          set -o pipefail
          if [ "${{ matrix.suite }}" = "contexto" ]; then
            node --test --test-concurrency=1 test/contexto-simples-pagina.test.mjs 2>&1 | tee /tmp/saida-chrome.txt
          else
            node --test --test-concurrency=2 --test-timeout=180000 test/*.mjs 2>&1 | tee /tmp/saida-chrome.txt
          fi
        shell: bash

      - name: Garantir que o teste de contexto não foi saltado
        if: always()
        run: |
          test -f /tmp/saida-chrome.txt || { echo "::error::o teste de contexto não chegou a executar"; exit 1; }
          if grep -q 'sem navegador' /tmp/saida-chrome.txt; then
            echo "::error::o teste foi saltado — o Chrome não foi encontrado"
            exit 1
          fi
          echo "teste de contexto não saltado"
