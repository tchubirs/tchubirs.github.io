[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipfactory"
version = "0.1.0"
description = "Fábrica de clipes licenciados para campanhas de content rewards"
requires-python = ">=3.10"

[project.scripts]
clipfactory = "clipfactory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
